cors:
  allow-origins:
    - "*"
debug: false
database-url: "postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable"

session:
  ttl: 24h
  cookie-name: ship_session
  same-site: lax

email:
  disabled: true
  sender-name: "ШиП Мониторинг"

rabbitmq-url: "amqp://guest:guest@localhost:5672/"
redis:
  url: redis:6379
  password: ""

frontend:
  host: ship-monitor.ru:3000
  email-confirmation-path: "/auth/confirm-email"
  email-confirmation-query: token

states:
  max-history-length: 3000

http.server:
  read-header-timeout: 5s
  port: 8080
