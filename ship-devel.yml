cors:
  allow-origins:
    - "http://localhost:5173"
debug: false
database-url: "postgres://katy:postgres@localhost:5432/auth-db?sslmode=disable"

auth:
  session:
    cookie:
      name: __Host-session
      path: /
      domain: ""
      secure: false
    ttl: 24h
    touch-interval: 1h

session:
  ttl: 24h
  cookie-name: ship_session
  same-site: lax

email:
  disabled: true
  sender-name: "ШиП Мониторинг"

rabbitmq-url: "amqp://guest:guest@localhost:5672/"
redis:
  url: redis:6379
  password: ""

frontend:
  host: ship-monitor.ru
  email-confirmation-path: "/auth/confirm-email"
  email-confirmation-query: token

states:
  max-history-length: 3000

http.server:
  read-header-timeout: 5s
  port: 8080

