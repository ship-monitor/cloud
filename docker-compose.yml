volumes:
  server_data:
  rabbitmq_data:
  spice_data:

networks:
  auth-net:
    driver: bridge
  spice-net:
    driver: bridge

services:
  # AUTH SERVICE
  auth-api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
      - "8071:8071"
    environment:
      SPICEDB_GRPC_PRESHARED_KEY: ${SPICEDB_GRPC_PRESHARED_KEY}
      SPICEDB_URL: spicedb:50051
      PORT: 8080
      DATABASE_URL: postgres://${SHIP_DATABASE_USER}:${SHIP_DATABASE_PASSWORD}@auth-db:5432/${SHIP_DATABASE_NAME}?sslmode=disable
      SESSION_TTL: 24h
      SESSION_COOKIE_NAME: ship_session
      SESSION_SAME_SITE: lax
      REDIS_URL: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      CLICKHOUSE_URL: "clickhouse:9000"
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE}

    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - auth-net
    healthcheck:
      test: ["CMD-SHELL", "curl localhost:8080/api/health -f || exit 1"]
      interval: 1m30s
      timeout: 5s
      retries: 3
      start_period: 30s
  # AUTH SERVICE DATABASE
  auth-db:
    networks:
      - auth-net
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SHIP_DATABASE_USER}
      POSTGRES_PASSWORD: ${SHIP_DATABASE_PASSWORD}
      POSTGRES_DB: ${SHIP_DATABASE_NAME}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - server_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SHIP_DATABASE_USER} -d ${SHIP_DATABASE_NAME}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  # RABBITMQ
  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "1883:1883"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    command: >
      bash -c "rabbitmq-plugins enable --offline rabbitmq_mqtt rabbitmq_web_mqtt &&
               docker-entrypoint.sh rabbitmq-server"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - auth-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rabbitmq-diagnostics --quiet check_running && rabbitmq-diagnostics --quiet check_local_alarms",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
  # REDIS
  redis:
    image: redis:7.4-alpine
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: >
      sh -c '
        mkdir -p /usr/local/etc/redis &&
        echo "bind 0.0.0.0" > /usr/local/etc/redis/redis.conf &&
        echo "requirepass $REDIS_PASSWORD" >> /usr/local/etc/redis/redis.conf &&
        echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
        echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
        echo "user default on nopass ~* +@all" > /usr/local/etc/redis/users.acl &&
        redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
      '
    ports:
      - "6379:6379"
    networks:
      - auth-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  spice-postgres:
    networks:
      - spice-net
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: spicedb
      POSTGRES_USER: ${SPICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SPICE_POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - spice_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPICE_POSTGRES_USER} -d spicedb"]
      interval: 5s
      timeout: 5s
      retries: 5

    # 2. Schema Migration Runner (Runs once, then exits)
  spicedb-migrate:
    networks:
      - spice-net
    image: authzed/spicedb:latest
    command: datastore migrate head
    environment:
      - SPICEDB_DATASTORE_ENGINE=postgres
      - SPICEDB_DATASTORE_CONN_URI=postgres://${SPICE_POSTGRES_USER}:${SPICE_POSTGRES_PASSWORD}@spice-postgres:5432/spicedb?sslmode=disable
    depends_on:
      spice-postgres:
        condition: service_healthy
    volumes:
      # Mounts your local schema file into the container
      - ./schemes/spicedb/scheme.zed:/etc/spicedb/schema.zed:ro

    # 3. Primary SpiceDB Engine
  spicedb:
    networks:
      - spice-net
    image: authzed/spicedb:latest
    command: serve
    ports:
      - "50051:50051" # gRPC
      - "50052:50052" # HTTP
      - "9090:9090" # Metrics
    environment:
      - SPICEDB_GRPC_PRESHARED_KEY=${SPICEDB_GRPC_PRESHARED_KEY}
      - SPICEDB_DATASTORE_ENGINE=postgres
      - SPICEDB_DATASTORE_CONN_URI=postgres://${SPICE_POSTGRES_USER}:${SPICE_POSTGRES_PASSWORD}@spice-postgres:5432/spicedb?sslmode=disable
    depends_on:
      spicedb-migrate:
        condition: service_completed_successfully
  # CLICKHOUSE
  clickhouse:
    restart: unless-stopped
    image: clickhouse:latest
    networks:
      - auth-net
    ports:
      - 9000:9000
      - 9440:9440
    environment:
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
