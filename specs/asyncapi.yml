asyncapi: 3.0.0
info:
  title: SHIP connection protocol
  version: 1.3.0
servers:
  development:
    host: localhost:4222
    description: Development NATS server
    protocol: nats
  production:
    host: ship-monitor.ru:4222
    description: Production NATS server
    protocol: nats
channels:
  connectRequests:
    address: device.{deviceId}.connect.requests
    parameters:
      deviceId:
        $ref: "#/components/parameters/deviceId"
    messages:
      request:
        $ref: "#/components/messages/connectRequest"

  connectResponses:
    address: device.{deviceId}.connect.responses
    parameters:
      deviceId:
        $ref: "#/components/parameters/deviceId"
    messages:
      response:
        $ref: "#/components/messages/connectResponse"

  devicesAlive:
    address: device.{deviceId}.health
    parameters:
      deviceId:
        $ref: "#/components/parameters/deviceId"
    messages:
      heartbeat:
        $ref: "#/components/messages/heartbeat"

  deviceMetrics:
    address: device.{deviceId}.metrics
    parameters:
      deviceId:
        $ref: "#/components/parameters/deviceId"
    messages:
      metrics:
        $ref: "#/components/messages/metrics"

  sensorMetrics:
    address: device.{deviceId}.metrics.sensor
    parameters:
      deviceId:
        $ref: "#/components/parameters/deviceId"
    messages:
      sensor:
        $ref: "#/components/messages/sensorMetrics"

  sensorDeclarations:
    address: device.{deviceId}.sensors
    parameters:
      deviceId:
        $ref: "#/components/parameters/deviceId"

  firmware:
    address: device.{deviceId}.firmware
    parameters:
      deviceId:
        $ref: "#/components/parameters/deviceId"

operations:
  onDeviceHeartbeat:
    title: Device sends heartbeat message
    action: receive
    channel:
      $ref: "#/channels/devicesAlive"
    messages:
      - $ref: "#/components/messages/heartbeat"

  publishConnectRequest:
    title: Cloud publishes connect request
    action: send
    channel:
      $ref: "#/channels/connectRequests"
    messages:
      - $ref: "#/components/messages/connectRequest"

  onConnectResponse:
    title: Device sends response with approving info
    action: receive
    channel:
      $ref: "#/channels/connectResponses"
    messages:
      - $ref: "#/components/messages/connectResponse"

  deviceMetrics:
    title: Device sends own metrics
    action: receive
    channel:
      $ref: "#/channels/deviceMetrics"
    messages:
      - $ref: "#/components/messages/metrics"

  sensorMetrics:
    title: Device sends own metrics
    action: receive
    channel:
      $ref: "#/channels/sensorMetrics"
    messages:
      - $ref: "#/components/messages/sensorMetrics"

  sensorDeclaration:
    title: Device sends list of its sensors
    action: receive
    channel:
      $ref: "#/channels/sensorDeclarations"
    messages:
      - $ref: "#/components/messages/sensorDeclaration"

  firmware:
    title: Device sends firmware information
    action: receive
    channel:
      $ref: "#/channels/firmware"
    messages:
      - $ref: "#/components/messages/firmware"

components:
  schemas:
    metric:
      type: object
      required: [name, type, unit, value, timestamp]
      properties:
        name:
          type: string
        type:
          type: string
          enum:
            - GAUGE
            - COUNTER
            - HISTOGRAM
        unit:
          type: string
        value:
          type: number
        timestamp:
          type: string
          format: date-time
          description: The UTC timestamp when metric was captured
          example: "2026-11-09T09:38:00Z"

    heartbeat:
      type: object
      required: [timestamp]
      properties:
        timestamp:
          type: string
          format: date-time

    firmware:
      description: Information about hardware and software of device or sensor
      type: object
      required: [manufacturer, model, revision, software]
      properties:
        manufacturer:
          type: string
        model:
          type: string
        revision:
          type: string
        software:
          type: string
          description: Software name and version
          example: "hub-service@v1.0"

    connectRequest:
      type: object
      required: [secretKey, requestId]
      properties:
        secretKey:
          type: string
        requestId:
          x-go-name: RequestID
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-imports:
            path: github.com/google/uuid

    connectResponse:
      type: object
      required: [approve, requestId]
      properties:
        approve:
          type: boolean
        requestId:
          x-go-name: RequestID
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-imports:
            path: github.com/google/uuid

    identificationHeaders:
      type: object
      required: [Authorization]
      properties:
        Authorization:
          type: string
          format: uuid
          description: Currently holding device identifier

    sensorId:
      type: string
      x-go-name: SensorID
      description: Sensor identifier. It could be in non-UUID format.

    sensorDeclarationItem:
      type: object
      required: [id, name, firmware]
      properties:
        id:
          $ref: "#/components/schemas/sensorId"
        name:
          type: string
        firmware:
          $ref: "#/components/schemas/firmware"

    sensorDeclaration:
      type: object
      required: [sensors]
      properties:
        sensors:
          type: array
          items:
            $ref: "#/components/schemas/sensorDeclarationItem"

  messages:
    heartbeat:
      contentType: application/json
      headers:
        $ref: "#/components/schemas/identificationHeaders"
      payload:
        $ref: "#/components/schemas/heartbeat"

    connectRequest:
      contentType: application/json
      payload:
        $ref: "#/components/schemas/connectRequest"

    connectResponse:
      contentType: application/json
      payload:
        $ref: "#/components/schemas/connectResponse"
      headers:
        $ref: "#/components/schemas/identificationHeaders"

    metrics:
      contentType: application/json
      headers:
        $ref: "#/components/schemas/identificationHeaders"
      payload:
        type: object
        required: [metrics]
        properties:
          metrics:
            type: array
            items:
              $ref: "#/components/schemas/metric"

    sensorMetrics:
      contentType: application/json
      headers:
        $ref: "#/components/schemas/identificationHeaders"
      payload:
        type: object
        required: [metrics, sensorId]
        properties:
          sensorId:
            x-go-name: SensorID
            $ref: "#/components/schemas/sensorId"
          metrics:
            type: array
            items:
              $ref: "#/components/schemas/metric"

    sensorDeclaration:
      contentType: application/json
      headers:
        $ref: "#/components/schemas/identificationHeaders"
      payload:
        $ref: "#/components/schemas/sensorDeclaration"

    firmware:
      contentType: application/json
      headers:
        $ref: "#/components/schemas/identificationHeaders"
      payload:
        $ref: "#/components/schemas/firmware"

  parameters:
    deviceId:
      x-go-name: DeviceID
      description: Device identifier in UUID format.
