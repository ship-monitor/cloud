asyncapi: 3.1.0
info:
  title: SHIP connection protocol
  version: 1.0.2
servers:
  development:
    host: localhost:4222
    description: Development NATS server
    protocol: nats
channels:
  connectRequests:
    address: device.{deviceId}.connect.requests
    parameters:
      deviceId:
        $ref: "#/components/parameters/deviceId"
    messages:
      request:
        $ref: "#/components/messages/connectRequest"
  connectResponses:
    address: device.{deviceId}.connect.responses
    parameters:
      deviceId:
        $ref: "#/components/parameters/deviceId"
    messages:
      request:
        $ref: "#/components/messages/connectResponse"

  devicesAlive:
    address: device.{deviceId}.health
    parameters:
      deviceId:
        $ref: "#/components/parameters/deviceId"
    messages:
      heartbeat:
        $ref: "#/components/messages/heartbeat"

operations:
  onDeviceHeartbeat:
    title: Device sends heartbeat message
    channel:
      $ref: "#/channels/devicesAlive"
    action: receive
    messages:
      - $ref: "#/channels/devicesAlive/messages/heartbeat"

components:
  schemas:
    heartbeat:
      type: object
      required: [timestamp]
      properties:
        timestamp:
          type: integer
          format: int64
    connectRequest:
      type: object
      required: [secretKey, deviceId]
      properties:
        secretKey:
          type: string
        requestId:
          type: string
          format: uuid
    connectResponse:
      type: object
      required: [approve, deviceId]
      properties:
        approve:
          type: boolean
        requestId:
          type: string
          format: uuid
    identificationHeaders:
      type: object
      required: [device-id]
      properties:
        device-id:
          type: string
          description: "Device identifier"
          format: uuid

  messages:
    heartbeat:
      contentType: application/json
      headers:
        type: object
        required: [device-id]
        properties:
          device-id:
            type: string
            description: "Device identifier"
            format: uuid
      payload:
        $ref: "#/components/schemas/heartbeat"
    connectRequest:
      contentType: application/json
      headers:
        $ref: "#/components/schemas/identificationHeaders"
      payload:
        $ref: "#/components/schemas/connectRequest"
    connectResponse:
      contentType: application/json
      payload:
        $ref: "#/components/schemas/connectResponse"

  parameters:
    deviceId:
      description: Device ID
