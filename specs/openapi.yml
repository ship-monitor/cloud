openapi: 3.1.0
info:
  title: Ship Monitor
  version: 2.0.0
  description: |
    OpenAPI specification of Ship Monitor cloud service.
servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.ship-monitor.ru
    description: Production server

tags:
  - name: user
    description: User management
  - name: auth
    description: Authentication endpoints
  - name: devices
    description: Devices management
  - name: sensors
    description: Sensors management
  - name: metrics
    description: Receiving metrics
  - name: meta
    description: Meta endpoints

security:
  - bearerToken: []
  - {}

paths:
  "/api/v2/health":
    get:
      tags: [meta]
      operationId: GetHealth
      responses:
        "200":
          $ref: "#/components/responses/HealthResponse"
        default:
          $ref: "#/components/responses/BadResponse"
  "/api/v2/auth/register":
    post:
      tags: [auth]
      operationId: RegisterUser
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/RegisterForm"
      responses:
        "201":
          description: "New user successfully registered"
        default:
          $ref: "#/components/responses/BadResponse"
  "/api/v2/auth/login":
    post:
      tags: [auth]
      operationId: LoginUser
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/LoginResponseOK"
        default:
          $ref: "#/components/responses/BadResponse"

  "/api/v2/auth/refresh":
    post:
      tags: [auth]
      operationId: RefreshToken
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/RefreshResponseOK"
        default:
          $ref: "#/components/responses/BadResponse"
  "/api/v2/devices":
    get:
      tags: [devices]
      security:
        - bearerToken: []
      operationId: GetDevices
      parameters:
        - name: page
          in: query
          description: Page index (starting from 0)
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: pageSize
          in: query
          description: Page size
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 50
      responses:
        "200":
          $ref: "#/components/responses/GetDevicesOK"
        default:
          $ref: "#/components/responses/BadResponse"
    post:
      tags: [devices]
      security:
        - bearerToken: []
      operationId: ConnectDevice
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required: [deviceId, securityKey]
              properties:
                deviceId:
                  type: string
                  format: uuid
                securityKey:
                  type: string
      responses:
        "201":
          description: "Successfully added new device"
        "409":
          $ref: "#/components/responses/ConnectDeviceConflict"
        default:
          $ref: "#/components/responses/BadResponse"
  "/api/v2/devices/{deviceId}":
    get:
      tags: [devices]
      security:
        - bearerToken: []
      operationId: GetDevice
      parameters:
        - $ref: "#/components/parameters/deviceId"
      responses:
        "200":
          $ref: "#/components/responses/GetDeviceResponseOK"
        default:
          $ref: "#/components/responses/BadResponse"
    patch:
      tags: [devices]
      security:
        - bearerToken: []
      operationId: EditDevice
      parameters:
        - $ref: "#/components/parameters/deviceId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Updated successful
        default:
          $ref: "#/components/responses/BadResponse"
    delete:
      tags: [devices]
      security:
        - bearerToken: []
      operationId: RemoveDevice
      parameters:
        - $ref: "#/components/parameters/deviceId"
      responses:
        "200":
          description: Deleted successful
        default:
          $ref: "#/components/responses/BadResponse"

  "/api/v2/devices/{deviceId}/online":
    get:
      tags: [devices]
      security:
        - bearerToken: []
      operationId: GetDeviceOnlineStatus
      parameters:
        - $ref: "#/components/parameters/deviceId"
      responses:
        "200":
          $ref: "#/components/responses/GetOnlineResponseOK"
        default:
          $ref: "#/components/responses/BadResponse"

  "/api/v2/devices/{deviceId}/sensors":
    get:
      tags: [devices, sensors]
      security:
        - bearerToken: []
      operationId: GetSensors
      parameters:
        - $ref: "#/components/parameters/deviceId"
      responses:
        "200":
          $ref: "#/components/responses/GetSensorsOK"
        default:
          $ref: "#/components/responses/BadResponse"
  "/api/v2/devices/{deviceId}/sensors/{sensorId}":
    patch:
      tags: [devices, sensors]
      security:
        - bearerToken: []
      operationId: EditSensor
      parameters:
        - $ref: "#/components/parameters/deviceId"
        - $ref: "#/components/parameters/sensorId"

      requestBody:
        $ref: "#/components/requestBodies/EditSensor"

      responses:
        "200":
          $ref: "#/components/responses/EditSensorOK"
        default:
          $ref: "#/components/responses/BadResponse"

  "/api/v2/devices/{deviceId}/sensors/{sensorId}/metrics":
    get:
      tags: [devices, sensors, metrics]
      security:
        - bearerToken: []
      operationId: GetSensorMetrics
      parameters:
        - $ref: "#/components/parameters/deviceId"
        - $ref: "#/components/parameters/sensorId"
        - $ref: "#/components/parameters/metricsFrom"
        - $ref: "#/components/parameters/metricsTo"
        - $ref: "#/components/parameters/metricsName"
        - $ref: "#/components/parameters/metricsLimit"

      responses:
        "200":
          $ref: "#/components/responses/GetSensorMetricsOK"
        default:
          $ref: "#/components/responses/BadResponse"

  "/api/v2/devices/{deviceId}/metrics":
    get:
      tags: [devices, metrics]
      security:
        - bearerToken: []
      operationId: GetDeviceMetrics
      parameters:
        - $ref: "#/components/parameters/deviceId"
      responses:
        "200":
          $ref: "#/components/responses/GetDeviceMetricsOK"
        default:
          $ref: "#/components/responses/BadResponse"

components:
  parameters:
    deviceId:
      in: path
      name: deviceId
      required: true
      schema:
        type: string
        format: uuid
    sensorId:
      in: path
      name: sensorId
      required: true
      schema:
        type: string
    metricsFrom:
      in: query
      name: from
      required: true
      schema:
        type: string
        format: date-time
    metricsTo:
      in: query
      name: to
      required: true
      schema:
        type: string
        format: date-time
    metricsName:
      in: query
      required: true
      name: metric
      schema:
        type: string
    metricsLimit:
      in: query
      required: false
      name: limit
      schema:
        type: integer
        format: int64
        maximum: 1000
        minimum: 10
        default: 100

  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer

  schemas:
    RegisterForm:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        name:
          type: string

    Device:
      type: object
      required: [id, name, ownerId]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ownerId:
          type: string
          format: uuid
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          example: error
        title:
          type: string
          example: Error title
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Additional details about problem
    ServiceStatus:
      type: string
      description: |
        Describes service status.
        - ok - service working
        - warn - service working but with some problems
        - fail - service available or not working
      enum:
        - ok
        - warn
        - fail
    Sensor:
      type: object
      required: [id, name, deviceId, displayName]
      properties:
        id:
          type: string
        name:
          type: string
        deviceId:
          type: string
          format: uuid
        displayName:
          type: string
    MetricType:
      type: string
      enum:
        - GAUGE
        - COUNTER
        - HISTOGRAM

    Metric:
      type: object
      required: [name, type, unit, value, timestamp]
      properties:
        name:
          type: string
        type:
          $ref: "#/components/schemas/MetricType"
        unit:
          type: string
        value:
          type: number
        timestamp:
          type: string
          format: date-time
          description: The UTC timestamp when metric was captured
          example: "2026-11-09T09:38:00Z"
    Metrics:
      type: object
      required: [name, type, unit, values]
      properties:
        name:
          type: string
        type:
          $ref: "#/components/schemas/MetricType"
        unit:
          type: string
        values:
          type: array
          items:
            $ref: "#/components/schemas/Metric"

  requestBodies:
    EditSensor:
      required: true
      content:
        "application/json":
          schema:
            type: object
            required: [displayName]
            properties:
              displayName:
                type: string

  responses:
    BadResponse:
      description: Returns on error, provide basic information about problem. Implements HTTP API details (RFC 9457) https://www.rfc-editor.org/info/rfc9457/.
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    LoginResponseOK:
      description: Successful login
      content:
        "application/json":
          schema:
            type: object
            required: [success, token, refreshToken]
            properties:
              success:
                type: boolean
              token:
                type: string
              refreshToken:
                type: string
    RefreshResponseOK:
      description: Successful refresh token
      content:
        "application/json":
          schema:
            type: object
            required: [success, token, refreshToken]
            properties:
              success:
                type: boolean
              token:
                type: string
              refreshToken:
                type: string

    HealthResponse:
      description: Describes healthness of application.
      content:
        "application/health+json":
          schema:
            type: object
            required: [status]
            properties:
              status:
                $ref: "#/components/schemas/ServiceStatus"
    GetOnlineResponseOK:
      description: Returns online status
      content:
        "application/json":
          schema:
            type: object
            required: [online, lastSeen]
            properties:
              online:
                type: boolean
              lastSeen:
                type: integer
                format: int64
    GetDeviceResponseOK:
      description: Returns device
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Device"
    GetDevicesOK:
      description: Returns list of all user's devices
      content:
        "application/json":
          schema:
            type: object
            required: [devices]
            properties:
              devices:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
    ConnectDeviceConflict:
      description: "Someone already added this device"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"

    GetSensorsOK:
      description: Return list of all device sensors
      content:
        "application/json":
          schema:
            type: object
            required: [sensors]
            properties:
              sensors:
                type: array
                items:
                  $ref: "#/components/schemas/Sensor"
    EditSensorOK:
      description: Successful editing, returns new sensor data
      content:
        "application/json":
          schema:
            type: object
            required: [sensor]
            properties:
              sensor:
                $ref: "#/components/schemas/Sensor"
    GetSensorMetricsOK:
      description: Returns sensor metrics
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Metrics"
    GetDeviceMetricsOK:
      description: Returns device metrics
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Metrics"
