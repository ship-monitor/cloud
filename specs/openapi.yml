openapi: 3.1.0
info:
  title: Ship Monitor API
  version: 1.0.0
  description: |
    OpenAPI specification generated from the Gin route registrations and handlers in this service.
servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.ship-monitor.ru
    description: Production server

tags:
  - name: user
    description: User management
  - name: auth
    description: Authentication endpoints
  - name: devices
    description: Devices management

security:
  - bearerToken: []
  - {}

paths:
  "/api/v2/auth/register":
    post:
      tags: [auth]
      operationId: RegisterUser
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                name:
                  type: string
      responses:
        "201":
          description: "New user successfully registered"
        default:
          $ref: "#/components/responses/BadResponse"
  "/api/v2/auth/login":
    post:
      tags: [auth]
      operationId: LoginUser
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Successfull login
          content:
            "application/json":
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                  token:
                    type: string
        "401":
          $ref: "#/components/responses/BadResponse"
        default:
          $ref: "#/components/responses/BadResponse"
  "/api/v2/devices":
    get:
      tags: [devices]
      operationId: GetDevices
      parameters:
        - name: page
          in: query
          description: Page index (starting from 0)
          schema:
            type: number
            format: integer
            minimum: 0
        - name: pageSize
          in: query
          description: Page size
          schema:
            type: number
            format: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Returns list of all devices
          content:
            "application/json":
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      $ref: "#/components/schemas/Device"
        default:
          $ref: "#/components/responses/BadResponse"
    post:
      tags: [devices]
      operationId: AddDevice
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required: [deviceId, securityKey]
              properties:
                deviceId:
                  type: string
                  format: uuid
                securityKey:
                  type: string
      responses:
        "201":
          description: "Successfully added new device"
        "409":
          description: "Someone already added this device"
        default:
          $ref: "#/components/responses/BadResponse"
  "/api/v2/devices/{deviceId}":
    get:
      tags: [devices]
      operationId: GetDevice
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Device response"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Device"
        default:
          $ref: "#/components/responses/BadResponse"
    patch:
      tags: [devices]
      operationId: EditDevice
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "200":
          description: "Updated successfull"
        default:
          $ref: "#/components/responses/BadResponse"
    delete:
      tags: [devices]
      operationId: RemoveDevice
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Deleted successfull"
        default:
          $ref: "#/components/responses/BadResponse"

  "/api/v2/devices/{deviceId}/metrics":
    get:
      tags: [devices]
      operationId: GetDeviceMetrics
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        default:
          $ref: "#/components/responses/BadResponse"

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
  schemas:
    Device:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        owner_id:
          type: string
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          example: error
        title:
          type: string
          example: Error title
        status:
          type: number
          format: integer
          example: 400
        detail:
          type: string
          example: Additional details about problem

  responses:
    BadResponse:
      description: Returns on error, provide basic information about problem
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
