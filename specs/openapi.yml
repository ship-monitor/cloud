openapi: 3.1.0
info:
  title: Ship Monitor API
  version: 1.0.0
  description: |
    OpenAPI specification generated from the Gin route registrations and handlers in this service.
servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.ship-monitor.ru
    description: Production server

tags:
  - name: user
    description: User management
  - name: auth
    description: Authentication endpoints
  - name: devices
    description: Devices management

security:
  - bearerToken: []
  - {}

paths:
  "/api/v2/auth/register":
    post:
      tags: [auth]
      operationId: RegisterUser
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/RegisterForm"
      responses:
        "201":
          description: "New user successfully registered"
        default:
          $ref: "#/components/responses/BadResponse"
  "/api/v2/auth/login":
    post:
      tags: [auth]
      operationId: LoginUser
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/LoginResponseOK"
        default:
          $ref: "#/components/responses/BadResponse"

  "/api/v2/auth/refresh":
    post:
      tags: [auth]
      operationId: RefreshToken
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/RefreshResponseOK"
        default:
          $ref: "#/components/responses/BadResponse"
  "/api/v2/devices":
    get:
      tags: [devices]
      security:
        - bearerToken: []
      operationId: GetDevices
      parameters:
        - name: page
          in: query
          description: Page index (starting from 0)
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: pageSize
          in: query
          description: Page size
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Returns list of all user's devices
          content:
            "application/json":
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      $ref: "#/components/schemas/Device"
        default:
          $ref: "#/components/responses/BadResponse"
    post:
      tags: [devices]
      security:
        - bearerToken: []
      operationId: ConnectDevice
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required: [deviceId, securityKey]
              properties:
                deviceId:
                  type: string
                  format: uuid
                securityKey:
                  type: string
      responses:
        "201":
          description: "Successfully added new device"
        "409":
          description: "Someone already added this device"
        default:
          $ref: "#/components/responses/BadResponse"
  "/api/v2/devices/{deviceId}":
    get:
      tags: [devices]
      security:
        - bearerToken: []
      operationId: GetDevice
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          $ref: "#/components/responses/GetDeviceResponseOK"
        default:
          $ref: "#/components/responses/BadResponse"
    patch:
      tags: [devices]
      security:
        - bearerToken: []
      operationId: EditDevice
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Updated successful
        default:
          $ref: "#/components/responses/BadResponse"
    delete:
      tags: [devices]
      security:
        - bearerToken: []
      operationId: RemoveDevice
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted successful
        default:
          $ref: "#/components/responses/BadResponse"

  "/api/v2/devices/{deviceId}/online":
    get:
      tags: [devices]
      security:
        - bearerToken: []
      operationId: GetDeviceOnlineStatus
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          $ref: "#/components/responses/GetOnlineResponseOK"
        default:
          $ref: "#/components/responses/BadResponse"

  "/api/v2/devices/{deviceId}/metrics":
    get:
      tags: [devices]
      security:
        - bearerToken: []
      operationId: GetDeviceMetrics
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        default:
          $ref: "#/components/responses/BadResponse"

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
  schemas:
    RegisterForm:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        name:
          type: string

    Device:
      type: object
      required: [id, name, ownerId]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ownerId:
          type: string
          format: uuid
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          example: error
        title:
          type: string
          example: Error title
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Additional details about problem
    ServiceStatus:
      type: string
      enum:
        - pass
        - fail
        - warn

  responses:
    BadResponse:
      description: Returns on error, provide basic information about problem. Implements HTTP API details (RFC 9457) https://www.rfc-editor.org/info/rfc9457/.
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    LoginResponseOK:
      description: Successful login
      content:
        "application/json":
          schema:
            type: object
            required: [success, token, refreshToken]
            properties:
              success:
                type: boolean
              token:
                type: string
              refreshToken:
                type: string
    RefreshResponseOK:
      description: Successful refresh token
      content:
        "application/json":
          schema:
            type: object
            required: [success, token, refreshToken]
            properties:
              success:
                type: boolean
              token:
                type: string
              refreshToken:
                type: string

    HealthResponse:
      description: Describes healthness of application.
      content:
        "application/health+json":
          schema:
            type: object
            properties:
              status:
                $ref: "#/components/schemas/ServiceStatus"
    GetOnlineResponseOK:
      description: Returns online status
      content:
        "application/json":
          schema:
            type: object
            required: [online, lastSeen]
            properties:
              online:
                type: boolean
              lastSeen:
                type: integer
                format: int64
    GetDeviceResponseOK:
      description: Returns device
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Device"
